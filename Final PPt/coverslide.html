<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS 420: Parallel Programming - Cover Slide</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-2: #eef1f7;
            --border: #d8dde8;
            --text: #1a1f2e;
            --text-muted: #6b7694;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --accent-light: #dbeafe;
            --green: #16a34a;
            --purple: #7c3aed;
            --purple-bg: #ede9fe;
            --code-bg: #f8fafc;
            --code-border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            /* Adds a subtle radial gradient to draw focus to the center */
            background-image: radial-gradient(circle at center, #ffffff 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── COVER CONTAINER ─────────────────────────────────────── */
        .cover-container {
            width: 100%;
            max-width: 860px;
            padding: 20px;
        }

        .cover-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(26, 31, 46, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── WINDOW HEADER ───────────────────────────────────────── */
        .window-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--code-bg);
            position: relative;
        }

        .window-dots {
            display: flex;
            gap: 8px;
            position: absolute;
            left: 20px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .dot-r { background: #ff5f57; border: 1px solid #e0443e; }
        .dot-y { background: #febc2e; border: 1px solid #d89f24; }
        .dot-g { background: #28c840; border: 1px solid #1aab29; }

        .window-title {
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ── COVER BODY ──────────────────────────────────────────── */
        .cover-body {
            padding: 80px 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Big Standalone Logo */
        .main-logo {
            height: 90px;       /* Adjust this value to make it bigger/smaller */
            width: auto;
            object-fit: contain;
            margin-bottom: 35px;
        }

        .main-title {
            font-size: 54px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -1.5px;
            margin-bottom: 16px;
            line-height: 1.1;
        }

        .main-title .highlight {
            color: var(--accent);
        }

        .course-code {
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 20px;
            color: var(--text-muted);
            font-weight: 600;
            background: var(--code-bg);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid var(--code-border);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 50px 0;
            position: relative;
        }

        .divider::after {
            content: "Group 11";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            padding: 0 20px;
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── TEAM SECTION ────────────────────────────────────────── */
        .team-grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }

        .member-card {
            display: flex;
            align-items: center;
            gap: 18px;
            text-align: left;
            background: var(--bg);
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid var(--border);
            flex: 1;
            max-width: 300px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .member-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.08);
            border-color: var(--accent-light);
        }

        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            flex-shrink: 0;
        }

        .avatar-1 { background: var(--accent-light); color: var(--accent-dark); }
        .avatar-2 { background: var(--purple-bg); color: var(--purple); }

        .member-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .member-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .member-role {
            font-size: 14px;
            color: var(--text-muted);
            font-family: "SFMono-Regular", Consolas, monospace;
        }

        /* ── FOOTER ──────────────────────────────────────────────── */
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="cover-container">
        <div class="cover-panel">
            
            <div class="window-header">
                <div class="window-dots">
                    <div class="dot dot-r"></div>
                    <div class="dot dot-y"></div>
                    <div class="dot dot-g"></div>
                </div>
                <span class="window-title">~/presentation/start.sh</span>
            </div>

            <div class="cover-body">
                
                <img src="logo.png" alt="Hochschule Fulda" class="main-logo">

                <h1 class="main-title">
                    <span class="highlight">Parallel</span> Programming
                </h1>
                
                <div class="course-code">
                    AI5085 (WiSe25/26)
                </div>

                <div class="divider"></div>

                <div class="team-grid">
                    
                    <div class="member-card">
                        <div class="avatar avatar-1">EF</div>
                        <div class="member-info">
                            <div class="member-name">Ehtesham Faraz</div>
                            <div class="member-role">Presenter</div>
                        </div>
                    </div>

                    <div class="member-card">
                        <div class="avatar avatar-2">MF</div>
                        <div class="member-info">
                            <div class="member-name">Md Fuzail</div>
                            <div class="member-role">Presenter</div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <footer class="footer">
        Task 1: Heatmap Analysis &amp; Early Exit Strategy
    </footer>

</body>

</html>
